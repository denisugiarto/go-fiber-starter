# Pengembangan lokal: API + Postgres. Salin .env.example menjadi .env lebih dulu.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
      POSTGRES_DB: app
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      retries: 10
  api:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/app?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env (min. 32 karakter)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports: ["8080:8080"]
volumes:
  pgdata:
